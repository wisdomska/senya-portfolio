name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same branch cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint, build and audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # Not `npm ci`. sharp ships per-platform optional binaries, and npm omits
      # the wasm32 subtree's own dependencies from a lockfile generated on
      # Windows, which makes `npm ci` fail on the Linux runner. This still
      # installs from the committed lockfile; --no-save keeps it unmodified, so
      # a drifting lockfile cannot slip through unnoticed.
      - name: Install
        run: npm install --no-audit --no-fund --no-save

      - name: Lockfile is unchanged by install
        run: git diff --exit-code package-lock.json

      - name: Prettier
        run: npm run format:check

      - name: ESLint
        run: npm run lint:js

      - name: Stylelint
        run: npm run lint:css

      - name: Astro type check
        run: npm run check

      # Astro warns rather than fails on unresolved content and images, so any
      # warning in the build output is treated as broken content.
      - name: Build
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build.log
          if grep -qiE '\[WARN\]|could not (be )?(find|resolve|optimize)' build.log; then
            echo "::error::Build emitted warnings — see the log above."
            exit 1
          fi

      - name: Validate HTML
        run: npx html-validate "dist/**/*.html"

      # One step, because a background process does not survive the step that
      # started it. astro preview serves the built site with the same clean
      # URLs Vercel does, so these audits exercise the real routes.
      - name: Accessibility and link check
        run: |
          npm run preview -- --port 4321 &
          SERVER=$!
          trap 'kill $SERVER 2>/dev/null || true' EXIT

          for _ in $(seq 1 60); do
            curl -sf http://localhost:4321/ >/dev/null && break
            sleep 1
          done
          curl -sf http://localhost:4321/ >/dev/null || {
            echo "::error::preview server did not start"
            exit 1
          }

          npx pa11y-ci --config .pa11yci.json

          npx linkinator http://localhost:4321 \
            --recurse \
            --silent \
            --retry \
            --timeout 20000 \
            --skip "^https://www\.figma\.com" \
            --skip "^https://wa\.me" \
            --skip "^https://clickscreators\.com" \
            --skip "^https://siastes\.com" \
            --skip "^https://beatzy\.figma\.site"

      - name: Lighthouse CI
        run: npx lhci autorun

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse
          path: .lighthouseci
          retention-days: 7
          if-no-files-found: ignore
